name: Deploy Backend (EC2 via AWS SSM)

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/shared/**"
      - "packages/mock-maker/**"
      - "packages/contracts/deployments/**"
      - "scripts/fetch-thetadata-iv.py"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Pull latest main and rebuild server container on EC2
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          PARAMS=$(jq -nc '{
            commands: [
              "set -eu",
              "cd /opt/bnb-payoff/app",
              "git fetch origin main",
              "git pull --ff-only origin main",
              "docker compose -f docker-compose.prod.yml up -d --build server",
              "i=0; ok=0; while [ $i -lt 30 ]; do if curl -fsS --max-time 5 http://127.0.0.1:4000/api/health >/dev/null; then ok=1; break; fi; sleep 2; i=$((i+1)); done; if [ $ok -ne 1 ]; then docker logs --tail 50 bnb-payoff-server; exit 1; fi",
              "docker compose -f docker-compose.prod.yml ps"
            ]
          }')

          CMD_ID=$(aws ssm send-command \
            --region ap-southeast-1 \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched SSM command: $CMD_ID"
          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region ap-southeast-1 \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --region ap-southeast-1 \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --region ap-southeast-1 \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text >&2
            echo "EC2 deployment failed with SSM status: $STATUS" >&2
            exit 1
          fi

      - name: Verify public API health endpoint
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://api-bnb.payoff.finance/api/health | jq '{ok, chainId, vaultAddress, settlementOracleAddress, dataSource, twapConfig}'
