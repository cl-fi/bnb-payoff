<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Payoff vs. a binary prediction market: payout at settlement for the same $100 stake</title>
  <desc id="d">A binary ticket pays nothing until price crosses its strike, then jumps to the full payout. Payoff pays more for every dollar the price moves. On a +2% move, the binary ticket pays $0 and Payoff pays about $180.</desc>

  <rect width="960" height="400" rx="20" fill="#000000"/>

  <text x="80" y="58" font-size="15" fill="#7e8690">$100 stake · same ~5x max payout</text>

  <line x1="80" y1="340" x2="880" y2="340" stroke="#2e333b" stroke-width="1"/>

  <path d="M80,340 L440,340 L440,80 L880,80" fill="none" stroke="#7e8690" stroke-width="2" stroke-dasharray="6 6" stroke-linejoin="round"/>
  <text x="456" y="64" font-size="17" fill="#7e8690">Binary: all or nothing</text>

  <path d="M80,340 L160,340 L800,90.4 L880,90.4" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="620" y="226" font-size="17" font-weight="700" fill="#ffffff">Payoff: paid as price moves</text>

  <line x1="400" y1="246.4" x2="400" y2="340" stroke="#7e8690" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="400" cy="340" r="5" fill="#000000" stroke="#7e8690" stroke-width="2"/>
  <circle cx="400" cy="246.4" r="6" fill="#ffffff"/>
  <text x="384" y="238" font-size="20" font-weight="700" fill="#ffffff" text-anchor="end">Payoff ~$180</text>
  <text x="384" y="328" font-size="17" fill="#7e8690" text-anchor="end">Binary $0</text>

  <line x1="204" y1="335" x2="204" y2="345" stroke="#7e8690" stroke-width="1"/>
  <g font-size="14" fill="#7e8690" text-anchor="middle">
    <text x="204" y="368">today</text>
    <text x="400" y="368">price +2%</text>
    <text x="880" y="368" text-anchor="end">settlement price →</text>
  </g>
</svg>
